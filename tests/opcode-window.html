<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace Opcode Window Smoke</title>
<button id="run">Run opcode smoke</button>
<output id="result"></output>
<script>
function opcodeWindowSmoke(seed) {
  let value = seed;
  for (let index = 0; index < 6; index++) {
    value = (value * 17 + index) ^ 0x5a;
  }
  return value;
}

function runOpcodeSmoke() {
  document.querySelector('#result').textContent = String(opcodeWindowSmoke(7));
}

document.querySelector('#run').addEventListener('click', runOpcodeSmoke);

if (new URL(location.href).searchParams.get('auto') === '1') {
  runOpcodeSmoke();
}
</script>
