<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace WebSocket Smoke</title>
<pre id="out">connecting...</pre>
<script>
const params = new URLSearchParams(location.search);
const port = params.get("wsPort") || "8765";
const socket = new WebSocket(`ws://127.0.0.1:${port}/echo`);
const out = document.getElementById("out");

socket.addEventListener("open", () => socket.send("trace-websocket-smoke"));
socket.addEventListener("message", ({ data }) => {
  out.textContent = `echo: ${data}`;
  socket.close();
});
socket.addEventListener("error", () => { out.textContent = "websocket error"; });
</script>
