<!doctype html>
<meta charset="utf-8">
<title>firefoxTrace DOM smoke test</title>
<body>
  <h1>firefoxTrace DOM smoke test</h1>
  <pre id="out">pending</pre>
</body>
<script>
  const results = [];

  results.push(navigator.userAgent);
  results.push(navigator.platform);
  results.push(navigator.language);
  results.push(navigator.cookieEnabled);
  results.push(navigator.onLine);
  results.push(navigator.hardwareConcurrency);
  results.push(screen.width);
  results.push(screen.height);

  function buildTraceCanvas(label, dx, dy, dw, dh) {
    const canvas = document.createElement("canvas");
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext("2d");
    ctx.fillText(label, 1, 12);
    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = 16;
    srcCanvas.height = 16;
    srcCanvas.getContext("2d").fillRect(0, 0, 16, 16);
    ctx.drawImage(srcCanvas, 0, 0, 8, 8, dx, dy, dw, dh);

    try {
      localStorage.setItem("firefoxTraceKey", "firefoxTraceValue");
      results.push(localStorage.getItem("firefoxTraceKey"));
    } catch (e) {
      results.push("localStorage:" + e.name);
    }

    return canvas.toDataURL();
  }

  results.push(buildTraceCanvas("trace", 2, 3, 10, 11));

  document.documentElement.dataset.done = String(results.length);
  document.getElementById("out").textContent = "done " + results.length;
</script>
