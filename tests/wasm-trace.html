<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace WASM Fixture</title>
<button id="compile">Compile WASM</button>
<output id="result"></output>
<script>
const moduleBytes = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
  0x01, 0x05, 0x01, 0x60, 0x00, 0x01, 0x7f,
  0x03, 0x02, 0x01, 0x00, 0x07, 0x08, 0x01, 0x04, 0x6d, 0x61, 0x69, 0x6e,
  0x00, 0x00, 0x0a, 0x06, 0x01, 0x04, 0x00, 0x41, 0x2a, 0x0b,
]);
function compileFixture() {
  const module = new WebAssembly.Module(moduleBytes);
  const instance = new WebAssembly.Instance(module);
  document.getElementById("result").textContent = String(instance.exports.main());
}
document.getElementById("compile").addEventListener("click", compileFixture);
const params = new URLSearchParams(location.search);
if (params.has("auto")) {
  const delay = Number(params.get("delay")) || 0;
  if (delay) setTimeout(compileFixture, delay); else compileFixture();
}
</script>
