<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace worker smoke</title>
<pre id="out">starting worker...</pre>
<script>
const workerSource = `
  self.onmessage = async ({ data }) => {
    function workerTraceValue(value) {
      return "worker-token-" + value;
    }
    const keepaliveResponse = await fetch(
      data.url + "?worker_token=" + data.token + "&worker_mode=keepalive", {
      keepalive: true,
      });
    const keepaliveBody = await keepaliveResponse.json();
    const regularResponse = await fetch(
      data.url + "?worker_token=" + data.token + "&worker_mode=regular");
    const regularBody = await regularResponse.json();
    self.postMessage(workerTraceValue(keepaliveBody.token + "-" + regularBody.token));
  };
`;
const worker = new Worker(URL.createObjectURL(new Blob([workerSource], {
  type: "text/javascript",
})));
worker.onmessage = ({ data }) => {
  document.getElementById("out").textContent = data;
  worker.terminate();
};
worker.postMessage({
  token: "smoke",
  url: new URL("/fetch-response-body.json", location.href).href,
});
</script>
