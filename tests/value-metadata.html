<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace JS value metadata smoke</title>
<button id="trigger">trigger</button>
<pre id="out">idle</pre>
<script>
function makeTraceParts() {
  return {
    ts: String(Date.now()),
    ts_num: Date.now(),
    fp: "fp-smoke",
    app: "app",
    token: "tk-smoke",
    digest: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef",
    version: "5.3",
    ok: true,
    payload: "payload-smoke",
  };
}

function makeTraceValue() {
  const parts = makeTraceParts();
  return [
    parts.ts,
    parts.fp,
    parts.app,
    parts.token,
    parts.digest,
    parts.version,
    parts.payload,
  ].join(";");
}

function triggerTraceValue() {
  const value = makeTraceValue();
  document.getElementById("out").textContent = value;
  const xhr = new XMLHttpRequest();
  xhr.open("GET", "/runtime-control-target.json?trace_value=" + encodeURIComponent(value), true);
  xhr.onloadend = () => {
    document.getElementById("out").textContent = value + "\nstatus=" + xhr.status;
    if (new URLSearchParams(location.search).get("close") === "1") {
      setTimeout(() => window.close(), 500);
    }
  };
  xhr.send();
}

document.getElementById("trigger").addEventListener("click", triggerTraceValue);

if (new URLSearchParams(location.search).get("auto") === "1") {
  setTimeout(triggerTraceValue, 500);
}
</script>
