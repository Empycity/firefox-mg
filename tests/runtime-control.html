<!doctype html>
<meta charset="utf-8">
<title>Firefox Trace runtime control smoke</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; }
  button { font: inherit; padding: 8px 12px; }
  pre { white-space: pre-wrap; }
</style>
<h1>runtime control smoke</h1>
<p>Start Firefox with trace paused, then run <code>tools/trace-control.sh TRACE_DIR start</code> before clicking.</p>
<p>Optional smoke automation: append <code>?auto=1&amp;delay=3000</code> to trigger once after the delay.</p>
<button id="trigger">trigger XHR</button>
<pre id="out">idle</pre>
<script>
function triggerXHR() {
  const token = "runtime-control-token-" + Date.now();
  const url = "/runtime-control-target.json?anti_content=" + encodeURIComponent(token);
  const xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onloadend = () => {
    document.getElementById("out").textContent =
      "sent " + token + "\nstatus=" + xhr.status;
  };
  xhr.send();
}

document.getElementById("trigger").addEventListener("click", triggerXHR);

const params = new URLSearchParams(location.search);
if (params.get("auto") === "1") {
  const delay = Math.max(0, Math.min(60000, Number(params.get("delay") || "3000")));
  setTimeout(triggerXHR, Number.isFinite(delay) ? delay : 3000);
}
</script>
