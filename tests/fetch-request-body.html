<!doctype html>
<meta charset="utf-8">
<title>firefoxTrace fetch request body smoke</title>
<script>
  async function run() {
    const body = JSON.stringify({
      token: "trace-fetch-request-body-token",
      nested: { n: 7 },
    });
    const response = await fetch("/fetch-echo?token=traceFetchRequestQuery", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body,
    });
    window.__traceFetchRequestBodyResult = await response.text();
  }
  run().catch((e) => {
    window.__traceFetchRequestBodyError = String(e);
  });
</script>
